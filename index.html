<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зимний Будильник</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="snowflakes" aria-hidden="true">
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
    </div>

    <div class="container">
        <h1>Зимний Будильник</h1>
        <div class="clock">
            <span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds">00</span>
        </div>

        <div class="alarm-settings">
            <input type="text" id="alarmTime" placeholder="HH:MM">
            
            <button id="setAlarm">Установить будильник</button>
            <div id="alarmStatus"></div>
        </div>

        <audio id="alarmSound" src="sounds/1.mp3" preload="auto"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
