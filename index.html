<!DOCTYPE html>
<html lang="ru" data-theme="dark-classic">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Sounds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video autoplay loop muted id="bg-video"><source src="background.mp4" type="video/mp4"></video>

    <nav class="glass-menu">
        <div class="logo"><span>Nova Sounds</span></div>
        <ul class="nav-links">
            <li class="active" onclick="switchTab('recommendations')">Рекомендации</li>
            <li onclick="switchTab('friends')">Друзья</li>
            <li onclick="switchTab('profile')">Профиль</li>
            <li onclick="switchTab('settings')">Настройки</li>
            <li id="nav-admin" style="display: none;" onclick="switchTab('admin')">Админ</li>
        </ul>
        <div id="auth-section"><button class="glass-btn" onclick="openModal('auth-modal')">Войти</button></div>
    </nav>

    <main id="content">
        <div id="recommendations" class="tab-content active">
            <h2>Рекомендации</h2>
            <div id="tracks-container" class="music-grid"></div>
        </div>
        
        <div id="friends" class="tab-content">
            <h2>Найти людей</h2>
            <div class="search-box glass-panel">
                <input type="text" id="f-search" class="glass-input" placeholder="Введите ник...">
                <button class="glass-btn accent" onclick="searchFriends()">Найти</button>
            </div>
            <div id="friends-results" class="music-grid" style="margin-top:20px;"></div>
        </div>

        <div id="profile" class="tab-content">
            <div id="profile-view"></div>
            <h3 style="margin: 20px 0;">Мои треки 📌</h3>
            <div id="pinned-container" class="music-grid"></div>
        </div>

        <div id="admin" class="tab-content">
            <h2>Админ Панель</h2>
            <div class="glass-panel p-20">
                <h3>Загрузить MP3</h3>
                <input type="file" id="track-file" class="glass-input" accept="audio/mp3">
                <input type="text" id="track-artist" class="glass-input" placeholder="Автор">
                <button class="glass-btn accent w-100" onclick="uploadTrack()">Опубликовать</button>
            </div>
        </div>
    </nav>

    <div class="music-player">
        <div class="p-info"><b id="p-title">Nova Sounds</b><br><small id="p-artist">Плеер</small></div>
        <audio id="main-audio" controls style="filter:invert(1); height:35px;"></audio>
    </div>

    <!-- МОДАЛКА ВХОДА С ПЕРЕКЛЮЧАТЕЛЕМ -->
    <div id="auth-modal" class="modal">
        <div class="modal-content glass-panel">
            <h2 id="modal-title">Вход</h2>
            <input type="text" id="auth-user" class="glass-input" placeholder="Никнейм">
            <input type="password" id="auth-pass" class="glass-input" placeholder="Пароль">
            <button class="glass-btn accent w-100" onclick="submitAuth()">Подтвердить</button>
            <p class="toggle-auth" style="margin-top:15px; cursor:pointer; text-decoration:underline;" onclick="toggleAuth()">Регистрация</p>
        </div>
    </div>

    <!-- Модалка настройки профиля -->
    <div id="edit-modal" class="modal">
        <div class="modal-content glass-panel">
            <h2>Настройки</h2>
            <input type="file" id="edit-av" class="glass-input" accept="image/*">
            <input type="file" id="edit-bn" class="glass-input" accept="image/*">
            <textarea id="edit-bio" class="glass-input" placeholder="О себе"></textarea>
            <button class="glass-btn accent w-100" onclick="saveProfile()">Сохранить</button>
            <button class="glass-btn w-100 mt-10" onclick="closeModal('edit-modal')">Отмена</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
