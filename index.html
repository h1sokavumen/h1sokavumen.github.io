<!DOCTYPE html>
<html lang="ru" data-theme="dark-classic">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Sounds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video autoplay loop muted id="bg-video"><source src="background.mp4" type="video/mp4"></video>

    <nav class="glass-menu">
        <div class="logo"><span>Nova Sounds</span></div>
        <ul class="nav-links">
            <li class="active" onclick="switchTab('recommendations')">Рекомендации</li>
            <li onclick="switchTab('friends')">Друзья</li>
            <li onclick="switchTab('profile')">Профиль</li>
            <li onclick="switchTab('settings')">Настройки</li>
            <li id="nav-admin" style="display: none;" onclick="switchTab('admin'); loadAdminUsers();">Админ</li>
        </ul>
        <div id="auth-section"><button class="glass-btn" onclick="openModal('auth-modal')">Войти</button></div>
    </nav>

    <main id="content">
        <div id="recommendations" class="tab-content active">
            <h2>Рекомендации</h2>
            <div id="tracks-container" class="music-grid"></div>
        </div>
        
        <div id="profile" class="tab-content">
            <div class="profile-card glass-panel">
                <div id="profile-banner" class="banner"></div>
                <div class="p-info">
                    <img id="profile-avatar" src="" class="avatar">
                    <h2 id="profile-name">Имя</h2>
                    <p id="profile-bio">Описание...</p>
                    <button class="glass-btn" onclick="openModal('edit-profile-modal')">Изменить профиль</button>
                </div>
            </div>
        </div>

        <div id="admin" class="tab-content">
            <h2>Админ Панель</h2>
            <div class="admin-grid">
                <div class="glass-panel p-20">
                    <h3>Добавить трек</h3>
                    <input type="text" id="track-title" class="glass-input" placeholder="Название">
                    <input type="text" id="track-artist" class="glass-input" placeholder="Автор">
                    <input type="text" id="track-url" class="glass-input" placeholder="URL mp3">
                    <button class="glass-btn accent" onclick="uploadTrack()">Загрузить</button>
                </div>
                <div class="glass-panel p-20">
                    <h3>Пользователи</h3>
                    <div id="admin-users-list"></div>
                </div>
            </div>
        </div>

        <div id="settings" class="tab-content">
            <h2>Настройки</h2>
            <select id="theme-selector" class="glass-input" onchange="changeTheme()">
                <option value="dark-classic">Черная классика</option>
                <option value="purple-dark">Фиолетовая ночь</option>
                <option value="white-classic">Светлая тема</option>
            </select>
        </div>
    </main>

    <div class="music-player">
        <div class="player-info">
            <b id="p-title">Nova Sounds</b><br><small id="p-artist">Выбери трек</small>
        </div>
        <div class="controls">
            <button class="icon-btn" onclick="togglePlay()">▶</button>
        </div>
        <audio id="main-audio"></audio>
    </div>

    <!-- Модалки -->
    <div id="auth-modal" class="modal">
        <div class="modal-content glass-panel">
            <h2 id="modal-title">Вход</h2>
            <input type="text" id="auth-username" class="glass-input" placeholder="Никнейм">
            <input type="password" id="auth-password" class="glass-input" placeholder="Пароль">
            <button class="glass-btn accent w-100" onclick="submitAuth()">Подтвердить</button>
            <p class="toggle-auth" onclick="toggleAuthMode()">Нет аккаунта? Регистрация</p>
        </div>
    </div>

    <div id="edit-profile-modal" class="modal">
        <div class="modal-content glass-panel">
            <h2>Настройки профиля</h2>
            <input type="text" id="edit-avatar" class="glass-input" placeholder="Ссылка на аватар">
            <input type="text" id="edit-banner" class="glass-input" placeholder="Ссылка на баннер">
            <textarea id="edit-bio" class="glass-input" placeholder="О себе"></textarea>
            <button class="glass-btn accent w-100" onclick="saveProfile()">Сохранить</button>
            <button class="glass-btn w-100 mt-10" onclick="closeModal('edit-profile-modal')">Отмена</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
