<!DOCTYPE html>
<html lang="ru" data-theme="dark-classic">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Sounds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video autoplay loop muted id="bg-video"><source src="background.mp4" type="video/mp4"></video>

    <nav class="glass-menu">
        <div class="logo"><span>Nova Sounds</span></div>
        <ul class="nav-links">
            <li class="active" onclick="switchTab('recommendations')">Рекомендации</li>
            <li onclick="switchTab('friends')">Друзья</li>
            <li onclick="switchTab('profile')">Мой Профиль</li>
            <li onclick="switchTab('settings')">Настройки</li>
            <li id="nav-admin" style="display: none;" onclick="switchTab('admin')">Админ</li>
        </ul>
        <div id="auth-section"></div>
    </nav>

    <main id="content">
        <!-- РЕКОМЕНДАЦИИ -->
        <div id="recommendations" class="tab-content active">
            <h2>Рекомендации</h2>
            <div id="tracks-container" class="music-grid"></div>
        </div>
        
        <!-- ПРОФИЛЬ -->
        <div id="profile" class="tab-content">
            <div id="self-profile-view"></div>
            <h3 style="margin-top: 30px;">Прикрепленные треки</h3>
            <div id="pinned-tracks-container" class="music-grid"></div>
        </div>

        <!-- АДМИНКА -->
        <div id="admin" class="tab-content">
            <h2>Админ Панель</h2>
            <div class="admin-grid">
                <div class="glass-panel p-20">
                    <h3>Загрузить трек</h3>
                    <input type="file" id="track-file" class="glass-input" accept="audio/mp3">
                    <input type="text" id="track-artist" class="glass-input" placeholder="Исполнитель (необязательно)">
                    <button class="glass-btn accent w-100" onclick="uploadTrack()">Опубликовать</button>
                </div>
                <div class="glass-panel p-20">
                    <h3>Выдать права</h3>
                    <input type="text" id="grant-username" class="glass-input" placeholder="Никнейм пользователя">
                    <div style="display: flex; gap: 10px;">
                        <button class="glass-btn w-100" onclick="grantRights('premium')">Премиум</button>
                        <button class="glass-btn w-100 accent" onclick="grantRights('admin')">Админ</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- НАСТРОЙКИ (ТЕМЫ) -->
        <div id="settings" class="tab-content">
            <h2>Настройки</h2>
            <div class="glass-panel p-20">
                <label>Тема оформления:</label>
                <select id="theme-selector" class="glass-input" onchange="changeTheme()">
                    <option value="dark-classic">Черная классика</option>
                    <option value="purple-dark">Фиолетовый градиент</option>
                    <option value="green-dark">Зеленый градиент</option>
                    <option value="blue-white">Голубой шлейф</option>
                    <option value="white-classic">Светлая тема</option>
                </select>
            </div>
        </div>
    </main>

    <!-- МОДАЛКА НАСТРОЕК ПРОФИЛЯ (ТЕПЕРЬ С ФАЙЛАМИ) -->
    <div id="edit-profile-modal" class="modal">
        <div class="modal-content glass-panel">
            <h2>Настройки профиля</h2>
            <p>Аватарка:</p>
            <input type="file" id="edit-avatar-file" class="glass-input" accept="image/*">
            <p>Баннер:</p>
            <input type="file" id="edit-banner-file" class="glass-input" accept="image/*">
            <textarea id="edit-bio" class="glass-input" placeholder="О себе..."></textarea>
            <button class="glass-btn accent w-100" onclick="saveProfile()">Сохранить изменения</button>
            <button class="glass-btn w-100 mt-10" onclick="closeModal('edit-profile-modal')">Отмена</button>
        </div>
    </div>

    <div class="music-player">
        <div class="player-info"><b id="p-title">Nova Sounds</b><br><small id="p-artist">Выбери музыку</small></div>
        <audio id="main-audio" controls style="filter: invert(1); height: 35px;"></audio>
    </div>

    <div id="auth-modal" class="modal"><div class="modal-content glass-panel"><h2 id="modal-title">Вход</h2><input type="text" id="auth-username" class="glass-input" placeholder="Ник"><input type="password" id="auth-password" class="glass-input" placeholder="Пароль"><button class="glass-btn accent w-100" onclick="submitAuth()">Войти</button><p class="toggle-auth" onclick="toggleAuthMode()">Регистрация</p></div></div>

    <script src="app.js"></script>
</body>
</html>
