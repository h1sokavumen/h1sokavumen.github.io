<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AMETHYST STREAM | h1sokavumen</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #a855f7;
            --bg: #050507;
            --glass: rgba(20, 20, 25, 0.8);
        }

        body {
            background: var(--bg);
            color: #e2e8f0;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background-image: radial-gradient(circle at 50% -20%, #2e1065 0%, #050507 80%);
            min-height: 100vh;
        }

        header {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
        }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }

        /* GLASSMORPHISM PLAYER */
        .player-wrap {
            background: var(--glass);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.7);
            position: relative;
        }

        .video-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* КНОПКИ */
        .controls {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            justify-content: center;
        }

        .btn {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            font-size: 12px;
        }

        .btn:hover, .btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 15px var(--accent);
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: var(--glass);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .card img { width: 100%; height: 230px; object-fit: cover; }
        .card p { padding: 10px; text-align: center; font-size: 13px; font-weight: 600; margin: 0; }

        .system-msg {
            text-align: center;
            font-size: 10px;
            color: #444;
            margin-top: 20px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">AMETHYST<span>BOX</span></div>
</header>

<div class="container">
    <div class="player-wrap">
        <h3 id="title" style="margin: 0 0 10px 10px; font-weight: 400; font-size: 16px; color: #aaa;">SYSTEM_IDLE</h3>
        <div class="video-box" id="player-container">
            <div style="display:flex; height:100%; align-items:center; justify-content:center; color:#222;">
                [ READY_TO_STREAM ]
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn active" onclick="setSrc('ashdi')">Ashdi (Stable)</button>
        <button class="btn" onclick="setSrc('vost')">Vost (Reserve)</button>
        <button class="btn" style="border-color: #fff; color: #fff;" onclick="reloadPlayer()">Fix Error</button>
    </div>

    <div class="grid" id="anime-list"></div>

    <div class="system-msg">dev: flamefragments | status: bypass_active</div>
</div>

<script>
    const database = [
        { title: "Дневник Будущего", id: "56", img: "https://shikimori.one/system/animes/original/10620.jpg" },
        { title: "Наруто", id: "442", img: "https://shikimori.one/system/animes/original/1735.jpg" },
        { title: "Земля-снежок", id: "2981", img: "https://animevost.org/uploads/posts/2026-05/1715764042_1.jpg" }
    ];

    let currentId = "";
    let currentEngine = "ashdi";

    function init() {
        const list = document.getElementById('anime-list');
        database.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${item.img}"><p>${item.title}</p>`;
            card.onclick = () => {
                currentId = item.id;
                document.getElementById('title').innerText = `PLAYING: ${item.title}`;
                render();
            };
            list.appendChild(card);
        });
    }

    function setSrc(e) {
        currentEngine = e;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        if(currentId) render();
    }

    function reloadPlayer() {
        if(currentId) render();
    }

    function render() {
        const container = document.getElementById('player-container');
        let url = (currentEngine === 'ashdi') 
            ? `https://ashdi.vip/vod/${currentId}` 
            : `https://vost.pw/frame/${currentId}`;

        // Очищаем и вставляем новый фрейм
        container.innerHTML = `<iframe 
            id="anime-frame"
            src="${url}" 
            allowfullscreen 
            allow="autoplay; encrypted-media"
            sandbox="allow-forms allow-scripts allow-same-origin">
        </iframe>`;

        // Хак: Если через 15 секунд плеер все еще пустой или с ошибкой (на глаз), 
        // пользователь может нажать "Fix Error", но мы также можем добавить авто-релоад
    }

    init();
</script>

</body>
</html>
