<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body>

    <canvas id="starfield"></canvas>
    
    <!-- Новый header для удобной адаптации -->
    <header class="top-bar">
        <div id="app-title">AGRO</div>
        <div id="clock-container">
            <div id="time"></div>
            <div id="date"></div>
        </div>
    </header>
    
    <div class="main-container">
        <div id="player-widget" class="widget">
            <img src="covers/1.jpg" alt="Обложка трека" id="album-cover">
            <div id="track-info">
                <div id="track-title">Трек не выбран</div>
                <div id="track-artist">Неизвестный исполнитель</div>
            </div>
            <div id="progress-container"><div id="progress-bar"></div></div>
            <div id="time-stamps">
                <span id="current-time">0:00</span>
                <span id="total-time">0:00</span>
            </div>
            <div class="player-controls">
                <button id="repeat-btn" title="Повтор трека"><i class="fas fa-repeat"></i></button>
                <button id="prev-btn"><i class="fas fa-backward-step"></i></button>
                <button id="play-pause-btn"><i class="fas fa-play"></i></button>
                <button id="next-btn"><i class="fas fa-forward-step"></i></button>
                <button id="shuffle-btn" title="Перемешать"><i class="fas fa-shuffle"></i></button>
            </div>
            <div class="extra-controls">
                <div id="volume-control">
                    <i class="fas fa-volume-high" id="volume-icon"></i>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                </div>
                <button id="playlist-toggle-btn" title="Показать плейлист"><i class="fas fa-list-ul"></i></button>
            </div>
        </div>
    </div>

    <div id="playlist-menu">
        <h2>Плейлист</h2>
        <ul id="playlist-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
