<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maloshko Shop - Ultimate 2D</title>
<style>
/* === БАЗОВЫЕ СТИЛИ === */
:root {
  --bg-dark: #120d0a; --wood-dark: #2c1e16; --wood-light: #4a3320;
  --gold: #d4af37; --gold-dim: #997a15; --text-main: #fdf5e6;
  --text-muted: #a89f91; --accent-green: #4caf50; --accent-red: #f44336;
  --accent-blue: #2196f3; --paper: #f4e4bc;
  --font-main: 'Segoe UI', Roboto, sans-serif; --font-display: 'Georgia', serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-main); overflow: hidden; user-select: none; }

/* === ЭКРАНЫ === */
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.active { display: flex; }

/* === ГЛАВНОЕ МЕНЮ === */
#main-menu { background: radial-gradient(circle at center, var(--wood-light), var(--bg-dark)); align-items: center; justify-content: center; text-align: center; }
.logo { font-family: var(--font-display); font-size: clamp(40px, 8vw, 80px); color: var(--gold); text-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); margin-bottom: 10px; font-weight: bold; }
.subtitle { color: var(--text-muted); font-size: clamp(14px, 3vw, 20px); margin-bottom: 40px; letter-spacing: 2px; }
.menu-btns { display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 300px; }
.btn-menu { background: linear-gradient(135deg, var(--gold), var(--gold-dim)); color: #000; font-size: 18px; font-weight: bold; padding: 15px; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.2s; }
.btn-menu:active { transform: scale(0.95); }
.btn-menu:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; }

/* === ИГРОВОЙ ЭКРАН === */
#game-screen { background: linear-gradient(to bottom, #1a120c, #0a0705); }

/* HUD */
.hud { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0, 0, 0, 0.8); border-bottom: 2px solid var(--gold-dim); z-index: 10; flex-wrap: wrap; gap: 10px;}
.hud-item { display: flex; flex-direction: column; align-items: center; }
.hud-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
.hud-value { font-size: 16px; font-weight: bold; color: var(--gold); font-family: monospace; }
.hud-value.green { color: var(--accent-green); }
.hud-btns { display: flex; gap: 10px; }
.btn-hud { background: var(--wood-light); border: 1px solid var(--gold); color: var(--text-main); padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s;}
.btn-hud:hover { background: var(--gold); color: #000; }

/* Игровая зона */
.game-area { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }

/* Полки */
.shelves-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
.shelf { background: linear-gradient(to bottom, var(--wood-light), var(--wood-dark)); border-bottom: 6px solid #1a1109; border-radius: 4px; display: flex; justify-content: center; gap: 15px; padding: 10px 10px 0 10px; box-shadow: 0 10px 15px rgba(0,0,0,0.5); flex-wrap: wrap; }
.product { position: relative; cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; }
.product:hover { transform: translateY(-5px); }
.product.selected { transform: translateY(-10px) scale(1.1); filter: drop-shadow(0 0 10px var(--gold)); }
.prod-qty { position: absolute; top: -8px; right: -8px; background: var(--accent-blue); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; border: 1px solid #fff; z-index: 2;}
.prod-name { font-size: 11px; color: var(--text-muted); margin-top: 5px; text-align: center; }
/* Подсказка цены при наведении */
.product::before { content: attr(data-price); position: absolute; top: -25px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: var(--gold); padding: 2px 6px; border-radius: 4px; font-size: 10px; opacity: 0; transition: 0.2s; pointer-events: none; white-space: nowrap; border: 1px solid var(--gold-dim);}
.product:hover::before { opacity: 1; }

/* Прилавок и Клиент */
.counter-area { height: 40%; min-height: 220px; background: linear-gradient(to top, var(--wood-dark), transparent); position: relative; display: flex; align-items: flex-end; justify-content: center; }
.counter-desk { position: absolute; bottom: 0; width: 100%; height: 60px; background: linear-gradient(to bottom, var(--wood-light), #1a1109); border-top: 4px solid var(--gold-dim); z-index: 5; }
.customer { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 4; transition: opacity 0.3s; opacity: 0; pointer-events: none; }
.customer.visible { opacity: 1; animation: slideUp 0.4s ease-out; }
@keyframes slideUp { from { transform: translate(-50%, 50px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

/* Диалог */
.bubble { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--text-main); color: #000; padding: 10px 15px; border-radius: 15px; font-size: 13px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5); width: max-content; max-width: 260px; text-align: center; margin-bottom: 10px; }
.bubble::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border-width: 8px; border-style: solid; border-color: var(--text-main) transparent transparent transparent; }

/* Касса */
.register-panel { position: absolute; bottom: 70px; right: 20px; z-index: 10; background: rgba(20, 15, 10, 0.95); border: 2px solid var(--gold-dim); border-radius: 10px; padding: 15px; width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
.reg-title { text-align: center; color: var(--gold); font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
.reg-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; color: var(--text-main); }
.reg-row.total { border-top: 1px dashed #555; padding-top: 6px; font-weight: bold; font-size: 14px; }
.reg-row.debt-warn { color: var(--accent-red); animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

.btn-group { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btn { flex: 1; padding: 10px 5px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 11px; transition: 0.2s; text-align: center; min-width: 45%; }
.btn:active { transform: scale(0.95); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
.btn-give { background: var(--accent-green); color: #fff; }
.btn-refuse { background: #555; color: #fff; }
.btn-debt { background: var(--accent-red); color: #fff; display: none; }
.btn-accept-debt { background: var(--accent-blue); color: #fff; display: none; width: 100%; }

/* Мини-чек */
.mini-receipt { position: absolute; bottom: 100%; right: 20px; background: #fff; color: #000; width: 180px; padding: 10px; font-family: monospace; font-size: 10px; border-left: 2px dashed #ccc; border-right: 2px dashed #ccc; box-shadow: 0 -5px 10px rgba(0,0,0,0.3); opacity: 0; transform: translateY(20px); transition: 0.3s; z-index: 9; pointer-events: none;}
.mini-receipt.show { opacity: 1; transform: translateY(0); }
.mini-receipt::before { content: ''; position: absolute; top: -5px; left: 0; right: 0; height: 5px; background: repeating-linear-gradient(45deg, transparent, transparent 5px, #fff 5px, #fff 10px); }

/* === МОДАЛЬНЫЕ ОКНА === */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
.modal-overlay.active { display: flex; }
.modal { background: var(--wood-dark); border: 2px solid var(--gold); border-radius: 10px; padding: 20px; width: 90%; max-width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); max-height: 90vh; display: flex; flex-direction: column;}
.modal-title { color: var(--gold); font-size: 18px; text-align: center; margin-bottom: 15px; font-family: var(--font-display); text-transform: uppercase;}

/* Тетрадь долгов */
.notebook-paper { background: var(--paper); color: #333; padding: 15px; border-radius: 5px; flex: 1; overflow-y: auto; background-image: repeating-linear-gradient(transparent, transparent 24px, #ccc 24px, #ccc 25px); line-height: 25px; font-family: 'Comic Sans MS', cursive, sans-serif; font-size: 14px;}
.debt-entry { display: flex; justify-content: space-between; border-bottom: 1px dashed #aaa; }

/* Оптовая база (Заказ) */
.wholesale-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px;}
.ws-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; border: 1px solid #444;}
.ws-info { display: flex; flex-direction: column; }
.ws-name { font-weight: bold; color: var(--text-main); font-size: 14px;}
.ws-price { font-size: 11px; color: var(--accent-green); }
.btn-buy { background: var(--gold); color: #000; border: none; padding: 5px 10px; border-radius: 3px; font-weight: bold; cursor: pointer; }
.btn-buy:active { transform: scale(0.95); }
.btn-buy:disabled { background: #555; color: #888; }

.btn-close { width: 100%; padding: 12px; margin-top: 15px; background: transparent; border: 1px solid var(--gold); color: var(--gold); border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
.btn-close:hover { background: var(--gold); color: #000; }

/* Уведомления */
.toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 1px solid var(--gold); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s; text-align: center; }
.toast.show { opacity: 1; }

/* Адаптивность */
@media (max-width: 768px) {
  .register-panel { position: relative; bottom: auto; right: auto; width: 100%; border-radius: 0; border-left: none; border-right: none; border-bottom: none; padding: 10px 15px; }
  .counter-area { height: auto; flex: 1; }
  .customer { bottom: 10px; }
  .game-area { flex-direction: column; }
  .shelves-container { height: 35vh; flex: none; }
  .mini-receipt { right: 10px; bottom: 100%; }
}
@media (min-width: 769px) { .shelves-container { padding-right: 300px; } }
</style>
</head>
<body>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="main-menu" class="screen active">
  <div class="logo">МАГАЗИН<br>МАЛОШКО</div>
  <div class="subtitle">Ultimate 2D Edition</div>
  <div class="menu-btns">
    <button class="btn-menu" id="btn-continue" onclick="continueGame()" style="display:none">ПРОДОЛЖИТЬ</button>
    <button class="btn-menu" onclick="newGame()">НОВАЯ ИГРА</button>
  </div>
</div>

<!-- ИГРОВОЙ ЭКРАН -->
<div id="game-screen" class="screen">
  <!-- HUD -->
  <div class="hud">
    <div class="hud-item"><span class="hud-label">Касса</span><span class="hud-value" id="ui-money">0.00 ₴</span></div>
    <div class="hud-item"><span class="hud-label">Репутация</span><span class="hud-value green" id="ui-score">0</span></div>
    <div class="hud-item"><span class="hud-label">День / Время</span><span class="hud-value" id="ui-time">Д1 08:00</span></div>
    <div class="hud-btns">
      <button class="btn-hud" onclick="openWholesale()">📦 Заказ</button>
      <button class="btn-hud" onclick="openNotebook()">📝 Долги</button>
      <button class="btn-hud" onclick="saveAndExit()">Выход</button>
    </div>
  </div>

  <div class="game-area">
    <!-- Полки -->
    <div class="shelves-container" id="shelves"></div>

    <!-- Прилавок -->
    <div class="counter-area">
      <div class="customer" id="customer">
        <div class="bubble" id="bubble">Здравствуйте!</div>
        <div id="customer-svg"></div>
      </div>
      <div class="counter-desk"></div>
    </div>

    <!-- Касса -->
    <div class="register-panel">
      <div class="mini-receipt" id="mini-receipt"></div>
      <div class="reg-title">КАССОВЫЙ АППАРАТ</div>
      <div class="reg-row"><span>Запрос:</span> <span id="reg-req" style="color:var(--gold)">—</span></div>
      <div class="reg-row"><span>Сумма:</span> <span id="reg-price">—</span></div>
      <div class="reg-row"><span>Получено:</span> <span id="reg-given">—</span></div>
      <div class="reg-row total" id="reg-result-row"><span>Сдача:</span> <span id="reg-change">—</span></div>
      
      <div class="btn-group">
        <button class="btn btn-give" id="btn-give" onclick="processSale()" disabled>ВЫДАТЬ</button>
        <button class="btn btn-refuse" id="btn-refuse" onclick="refuseCustomer()">ОТКАЗАТЬ</button>
        <button class="btn btn-debt" id="btn-debt" onclick="writeDebt()">В ДОЛГ</button>
        <button class="btn btn-accept-debt" id="btn-accept-debt" onclick="acceptDebtRepayment()">ПРИНЯТЬ ДОЛГ</button>
      </div>
    </div>
  </div>
</div>

<!-- ТЕТРАДЬ ДОЛГОВ -->
<div class="modal-overlay" id="modal-notebook">
  <div class="modal">
    <div class="modal-title">ТЕТРАДЬ ДОЛЖНИКОВ</div>
    <div class="notebook-paper" id="debt-list"></div>
    <div style="text-align: right; margin-top: 10px; color: var(--text-main); font-weight: bold;">
      Итого долгов: <span id="total-debt" style="color: var(--accent-red)">0.00 ₴</span>
    </div>
    <button class="btn-close" onclick="closeModal('modal-notebook')">ЗАКРЫТЬ</button>
  </div>
</div>

<!-- ОПТОВАЯ БАЗА (ЗАКАЗ) -->
<div class="modal-overlay" id="modal-wholesale">
  <div class="modal">
    <div class="modal-title">ОПТОВАЯ БАЗА</div>
    <div style="text-align:center; margin-bottom:10px; font-size:12px; color:var(--text-muted)">Доставка занимает 1 игровой час.</div>
    <div class="wholesale-list" id="ws-list"></div>
    <button class="btn-close" onclick="closeModal('modal-wholesale')">ЗАКРЫТЬ</button>
  </div>
</div>

<!-- КОНЕЦ ДНЯ -->
<div class="modal-overlay" id="modal-endday">
  <div class="modal" style="text-align: center;">
    <div class="modal-title" id="end-title">ДЕНЬ ЗАВЕРШЕН</div>
    <p style="margin: 15px 0; color: var(--text-muted); line-height: 1.6;">
      Баланс: <b style="color:var(--gold)" id="end-money">0.00 ₴</b><br>
      Репутация: <b style="color:var(--accent-green)" id="end-score">0</b>
    </p>
    <button class="btn-menu" style="width: 100%; margin-top: 10px;" onclick="nextDay()">СЛЕДУЮЩИЙ ДЕНЬ</button>
  </div>
</div>

<!-- УВЕДОМЛЕНИЕ -->
<div class="toast" id="toast">Сообщение</div>

<script>
// === БАЗА ДАННЫХ ===
const PRODS = [
  { id: 'bread', name: 'Хлеб', price: 0.30, wsPrice: 0.15, svg: '<rect x="4" y="10" width="32" height="20" rx="10" fill="#d4a373"/><path d="M10,15 Q20,5 30,15" stroke="#bc6c25" stroke-width="2" fill="none"/>' },
  { id: 'milk', name: 'Молоко', price: 0.40, wsPrice: 0.20, svg: '<rect x="10" y="10" width="20" height="25" fill="#fefae0"/><polygon points="10,10 20,2 30,10" fill="#0077b6"/><text x="20" y="25" font-size="8" fill="#0077b6" text-anchor="middle" font-family="sans-serif">М</text>' },
  { id: 'sugar', name: 'Сахар', price: 0.55, wsPrice: 0.30, svg: '<rect x="8" y="12" width="24" height="24" rx="2" fill="#e9edc9"/><text x="20" y="28" font-size="7" fill="#555" text-anchor="middle">САХАР</text>' },
  { id: 'salt', name: 'Соль', price: 0.20, wsPrice: 0.10, svg: '<rect x="10" y="10" width="20" height="26" rx="2" fill="#ffffff"/><text x="20" y="26" font-size="7" fill="#555" text-anchor="middle">СОЛЬ</text>' },
  { id: 'matches', name: 'Спички', price: 0.10, wsPrice: 0.05, svg: '<rect x="8" y="15" width="24" height="10" fill="#e63946"/><rect x="10" y="17" width="20" height="6" fill="#f1faee"/>' },
  { id: 'canned', name: 'Тушёнка', price: 0.90, wsPrice: 0.50, svg: '<rect x="8" y="12" width="24" height="16" rx="3" fill="#606c38"/><rect x="8" y="10" width="24" height="4" rx="1" fill="#a3b18a"/><rect x="8" y="26" width="24" height="4" rx="1" fill="#a3b18a"/>' },
  { id: 'vodka', name: 'Водка', price: 2.80, wsPrice: 1.50, svg: '<rect x="14" y="12" width="12" height="24" rx="2" fill="#a8dadc"/><rect x="16" y="4" width="8" height="8" fill="#a8dadc"/><rect x="16" y="2" width="8" height="3" fill="#e63946"/><rect x="14" y="20" width="12" height="8" fill="#f1faee"/>' },
  { id: 'cigarettes', name: 'Сигареты', price: 0.35, wsPrice: 0.15, svg: '<rect x="10" y="8" width="20" height="26" fill="#dda15e"/><rect x="10" y="8" width="20" height="8" fill="#f1faee"/>' },
  { id: 'newspaper', name: 'Газета', price: 0.05, wsPrice: 0.02, svg: '<rect x="6" y="6" width="28" height="28" fill="#ccd5ae"/><line x1="10" y1="12" x2="30" y2="12" stroke="#555" stroke-width="2"/><line x1="10" y1="18" x2="25" y2="18" stroke="#555" stroke-width="2"/><line x1="10" y1="24" x2="28" y2="24" stroke="#555" stroke-width="2"/>' },
  { id: 'butter', name: 'Масло', price: 0.65, wsPrice: 0.35, svg: '<rect x="6" y="14" width="28" height="14" rx="2" fill="#ffb703"/><rect x="8" y="16" width="24" height="10" fill="#fb8500" opacity="0.5"/>' }
];

const CUSTOMERS = [
  { type: 'granny', names: ['Баба Нюра', 'Тетя Галя', 'Бабушка Зина'], color: '#9c6644' },
  { type: 'man', names: ['Дядя Вася', 'Петрович', 'Михалыч'], color: '#2a9d8f' },
  { type: 'woman', names: ['Светлана', 'Мария Ивановна', 'Тетя Лена'], color: '#e76f51' },
  { type: 'child', names: ['Школьник Вовка', 'Соседка Маша', 'Мальчик Витя'], color: '#457b9d' }
];

// === СОСТОЯНИЕ ИГРЫ ===
let G = { money: 5.00, score: 0, day: 1, time: 8 * 60, stock: {}, debts: [], deliveries: [] };
let clockInterval, customerTimeout;
let currentCustomer = null;
let selectedProduct = null;
let isDayActive = false;

// === ИНИЦИАЛИЗАЦИЯ И СОХРАНЕНИЕ ===
window.onload = () => {
  if (localStorage.getItem('maloshko_save')) {
    document.getElementById('btn-continue').style.display = 'block';
  }
};

function newGame() {
  G = { money: 10.00, score: 0, day: 1, time: 8 * 60, stock: {}, debts: [], deliveries: [] };
  PRODS.forEach(p => G.stock[p.id] = 15); // Стартовый запас
  startGame();
}

function continueGame() {
  const saved = JSON.parse(localStorage.getItem('maloshko_save'));
  if (saved) { G = saved; startGame(); }
}

function saveGame() {
  localStorage.setItem('maloshko_save', JSON.stringify(G));
}

function saveAndExit() {
  saveGame();
  isDayActive = false;
  clearInterval(clockInterval);
  clearTimeout(customerTimeout);
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('main-menu').classList.add('active');
  if (localStorage.getItem('maloshko_save')) document.getElementById('btn-continue').style.display = 'block';
}

function startGame() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('game-screen').classList.add('active');
  isDayActive = true;
  updateHUD(); renderShelves();
  clockInterval = setInterval(tickTime, 1000); // 1 игровая минута = 1 сек
  scheduleNextCustomer();
}

// === ОТРИСОВКА ===
function getCustomerSVG(color) {
  return `<svg width="100" height="120" viewBox="0 0 100 120"><path d="M20,120 L20,60 Q20,40 50,40 Q80,40 80,60 L80,120 Z" fill="${color}" stroke="#000" stroke-width="2"/><circle cx="50" cy="30" r="20" fill="#ffcdb2" stroke="#000" stroke-width="2"/><circle cx="43" cy="28" r="2" fill="#000"/><circle cx="57" cy="28" r="2" fill="#000"/></svg>`;
}

function updateHUD() {
  document.getElementById('ui-money').textContent = G.money.toFixed(2) + ' ₴';
  document.getElementById('ui-score').textContent = G.score;
  let h = Math.floor(G.time / 60), m = G.time % 60;
  document.getElementById('ui-time').textContent = `Д${G.day} ${(h<10?'0'+h:h)}:${(m<10?'0'+m:m)}`;
}

function renderShelves() {
  const container = document.getElementById('shelves');
  container.innerHTML = '';
  for(let i = 0; i < PRODS.length; i += 5) {
    const shelf = document.createElement('div');
    shelf.className = 'shelf';
    PRODS.slice(i, i + 5).forEach(p => {
      const el = document.createElement('div');
      el.className = 'product';
      el.id = 'prod-' + p.id;
      el.setAttribute('data-price', p.price.toFixed(2) + ' ₴');
      el.onclick = () => selectProduct(p.id);
      el.innerHTML = `<div class="prod-qty">${G.stock[p.id]}</div><svg width="40" height="40" viewBox="0 0 40 40">${p.svg}</svg><div class="prod-name">${p.name}</div>`;
      shelf.appendChild(el);
    });
    container.appendChild(shelf);
  }
}

// === ЛОГИКА КЛИЕНТОВ ===
function scheduleNextCustomer() {
  if (!isDayActive) return;
  customerTimeout = setTimeout(spawnCustomer, Math.random() * 3000 + 2000);
}

function spawnCustomer() {
  if (!isDayActive) return;
  
  const cType = CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)];
  const name = cType.names[Math.floor(Math.random() * cType.names.length)];
  document.getElementById('customer-svg').innerHTML = getCustomerSVG(cType.color);
  
  // Шанс 15% что пришел вернуть долг (если есть долги)
  if (G.debts.length > 0 && Math.random() < 0.15) {
    const debtIndex = Math.floor(Math.random() * G.debts.length);
    const debt = G.debts[debtIndex];
    
    currentCustomer = { type: 'repay', name: debt.name, amount: debt.amount, index: debtIndex };
    document.getElementById('bubble').textContent = `Я долг принес! Вот ${debt.amount.toFixed(2)} ₴. Спасибо!`;
    
    setupRegisterUI('Возврат долга', '—', debt.amount, 0, false, true);
  } else {
    // Обычный покупатель
    const prod = PRODS[Math.floor(Math.random() * PRODS.length)];
    // Количество от 1 до 20 (чаще просят мало)
    let qty = Math.floor(Math.pow(Math.random(), 2) * 19) + 1; 
    const totalCost = parseFloat((prod.price * qty).toFixed(2));
    
    let isShort = Math.random() < 0.15;
    let moneyGiven = isShort ? parseFloat((totalCost * (Math.random() * 0.5 + 0.2)).toFixed(2)) : parseFloat((totalCost + [0, 1, 5, 10][Math.floor(Math.random()*4)]).toFixed(2));
    if(moneyGiven < totalCost && !isShort) moneyGiven = totalCost; // Защита от багов округления

    currentCustomer = { type: 'buy', name: name, product: prod, qty: qty, totalCost: totalCost, money: moneyGiven, isShort: isShort, debtAmount: isShort ? totalCost - moneyGiven : 0 };
    
    let phrase = isShort ? `Дай ${prod.name} (${qty} шт). У меня только ${moneyGiven.toFixed(2)} ₴... Запишешь?` : `Мне нужно ${prod.name}, ${qty} шт. Вот ${moneyGiven.toFixed(2)} ₴.`;
    document.getElementById('bubble').textContent = phrase;
    
    setupRegisterUI(`${prod.name} x${qty}`, totalCost, moneyGiven, isShort ? currentCustomer.debtAmount : moneyGiven - totalCost, isShort, false);
  }
  
  selectedProduct = null;
  document.querySelectorAll('.product').forEach(el => el.classList.remove('selected'));
  document.getElementById('customer').classList.add('visible');
}

function setupRegisterUI(req, price, given, change, isShort, isRepay) {
  document.getElementById('reg-req').textContent = req;
  document.getElementById('reg-price').textContent = price !== '—' ? price.toFixed(2) + ' ₴' : '—';
  document.getElementById('reg-given').textContent = given.toFixed(2) + ' ₴';
  
  const resRow = document.getElementById('reg-result-row');
  const resVal = document.getElementById('reg-change');
  
  document.getElementById('btn-give').style.display = isRepay ? 'none' : 'block';
  document.getElementById('btn-refuse').style.display = isRepay ? 'none' : 'block';
  document.getElementById('btn-debt').style.display = isShort ? 'block' : 'none';
  document.getElementById('btn-accept-debt').style.display = isRepay ? 'block' : 'none';
  
  document.getElementById('btn-give').disabled = true;
  document.getElementById('btn-debt').disabled = true;

  if (isRepay) {
    resRow.className = 'reg-row total';
    resRow.querySelector('span').textContent = 'К зачислению:';
    resVal.textContent = given.toFixed(2) + ' ₴';
  } else if (isShort) {
    resRow.className = 'reg-row total debt-warn';
    resRow.querySelector('span').textContent = 'Не хватает:';
    resVal.textContent = change.toFixed(2) + ' ₴';
    document.getElementById('btn-give').style.display = 'none';
  } else {
    resRow.className = 'reg-row total';
    resRow.querySelector('span').textContent = 'Сдача:';
    resVal.textContent = change.toFixed(2) + ' ₴';
  }
}

function selectProduct(id) {
  if (!currentCustomer || currentCustomer.type !== 'buy') return;
  selectedProduct = id;
  document.querySelectorAll('.product').forEach(el => { el.classList.remove('selected'); if (el.id === 'prod-' + id) el.classList.add('selected'); });
  
  const btnGive = document.getElementById('btn-give');
  const btnDebt = document.getElementById('btn-debt');
  
  if (G.stock[id] >= currentCustomer.qty) {
    btnGive.disabled = false; btnDebt.disabled = false;
    btnGive.textContent = "ВЫДАТЬ";
  } else {
    btnGive.disabled = true; btnDebt.disabled = true;
    btnGive.textContent = "НЕТ НА СКЛАДЕ";
  }
}

// === ТРАНЗАКЦИИ ===
function processSale() {
  if (!currentCustomer || !selectedProduct) return;
  if (selectedProduct !== currentCustomer.product.id) { showToast("Это не тот товар!"); G.score = Math.max(0, G.score - 5); updateHUD(); return; }
  
  G.money += currentCustomer.totalCost;
  G.score += 10;
  G.stock[selectedProduct] -= currentCustomer.qty;
  
  showMiniReceipt(currentCustomer.product.name, currentCustomer.qty, currentCustomer.totalCost, currentCustomer.money, currentCustomer.money - currentCustomer.totalCost);
  finishTransaction("Спасибо за покупку!");
}

function writeDebt() {
  if (!currentCustomer || !selectedProduct) return;
  if (selectedProduct !== currentCustomer.product.id) { showToast("Это не тот товар!"); return; }
  
  G.money += currentCustomer.money;
  G.score += 15;
  G.stock[selectedProduct] -= currentCustomer.qty;
  G.debts.push({ name: currentCustomer.name, amount: currentCustomer.debtAmount });
  
  showMiniReceipt(currentCustomer.product.name, currentCustomer.qty, currentCustomer.totalCost, currentCustomer.money, 0, currentCustomer.debtAmount);
  finishTransaction("Записал в тетрадь. Не забудь вернуть!");
}

function acceptDebtRepayment() {
  G.money += currentCustomer.amount;
  G.score += 5;
  G.debts.splice(currentCustomer.index, 1); // Удаляем долг
  finishTransaction("Отлично, вычеркиваю из тетради!");
}

function refuseCustomer() {
  if (!currentCustomer) return;
  G.score = Math.max(0, G.score - 2);
  finishTransaction("Извините, ничем не могу помочь.");
}

function finishTransaction(msg) {
  document.getElementById('bubble').textContent = msg;
  updateHUD(); renderShelves(); saveGame();
  
  document.getElementById('btn-give').disabled = true;
  document.getElementById('btn-debt').disabled = true;
  
  setTimeout(() => {
    document.getElementById('customer').classList.remove('visible');
    currentCustomer = null;
    setupRegisterUI('—', '—', 0, 0, false, false);
    scheduleNextCustomer();
  }, 1500);
}

function showMiniReceipt(name, qty, total, given, change, debt = 0) {
  const r = document.getElementById('mini-receipt');
  r.innerHTML = `
    <div style="text-align:center; font-weight:bold; margin-bottom:5px;">ЧЕК</div>
    <div style="display:flex; justify-content:space-between;"><span>${name} x${qty}</span><span>${total.toFixed(2)}</span></div>
    <div style="border-top:1px dashed #000; margin:5px 0;"></div>
    <div style="display:flex; justify-content:space-between;"><span>ИТОГО:</span><span>${total.toFixed(2)}</span></div>
    <div style="display:flex; justify-content:space-between;"><span>НАЛИЧНЫЕ:</span><span>${given.toFixed(2)}</span></div>
    ${debt > 0 ? `<div style="display:flex; justify-content:space-between; color:red;"><span>В ДОЛГ:</span><span>${debt.toFixed(2)}</span></div>` : `<div style="display:flex; justify-content:space-between;"><span>СДАЧА:</span><span>${change.toFixed(2)}</span></div>`}
  `;
  r.classList.add('show');
  setTimeout(() => r.classList.remove('show'), 3000);
}

// === ВРЕМЯ И ДОСТАВКА ===
function tickTime() {
  G.time++;
  updateHUD();
  
  // Проверка доставок
  for (let i = G.deliveries.length - 1; i >= 0; i--) {
    if (G.time >= G.deliveries[i].time) {
      G.stock[G.deliveries[i].id] += 10;
      showToast(`📦 Доставлено: ${PRODS.find(p=>p.id===G.deliveries[i].id).name} (10 шт)`);
      G.deliveries.splice(i, 1);
      renderShelves();
      saveGame();
    }
  }
  
  if (G.time >= 20 * 60) endDay(); // 20:00
}

function endDay() {
  isDayActive = false;
  clearInterval(clockInterval); clearTimeout(customerTimeout);
  document.getElementById('customer').classList.remove('visible');
  
  document.getElementById('end-title').textContent = `ДЕНЬ ${G.day} ЗАВЕРШЕН`;
  document.getElementById('end-money').textContent = G.money.toFixed(2) + ' ₴';
  document.getElementById('end-score').textContent = G.score;
  document.getElementById('modal-endday').classList.add('active');
  saveGame();
}

function nextDay() {
  G.day++; G.time = 8 * 60;
  document.getElementById('modal-endday').classList.remove('active');
  startGame();
}

// === МОДАЛЬНЫЕ ОКНА ===
function openNotebook() {
  const list = document.getElementById('debt-list');
  let total = 0;
  if (G.debts.length === 0) {
    list.innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">Пока должников нет.</div>';
  } else {
    list.innerHTML = '';
    G.debts.forEach(d => {
      total += d.amount;
      list.innerHTML += `<div class="debt-entry"><span>${d.name}</span><span style="color:var(--accent-red)">${d.amount.toFixed(2)} ₴</span></div>`;
    });
  }
  document.getElementById('total-debt').textContent = total.toFixed(2) + ' ₴';
  document.getElementById('modal-notebook').classList.add('active');
}

function openWholesale() {
  const list = document.getElementById('ws-list');
  list.innerHTML = '';
  PRODS.forEach(p => {
    const cost = p.wsPrice * 10;
    const btn = document.createElement('button');
    btn.className = 'btn-buy';
    btn.textContent = `Купить 10 шт (${cost.toFixed(2)} ₴)`;
    btn.disabled = G.money < cost;
    btn.onclick = () => buyWholesale(p.id, cost);
    
    const item = document.createElement('div');
    item.className = 'ws-item';
    item.innerHTML = `<div class="ws-info"><span class="ws-name">${p.name}</span><span class="ws-price">Опт: ${p.wsPrice.toFixed(2)} ₴/шт</span></div>`;
    item.appendChild(btn);
    list.appendChild(item);
  });
  document.getElementById('modal-wholesale').classList.add('active');
}

function buyWholesale(id, cost) {
  if (G.money >= cost) {
    G.money -= cost;
    G.deliveries.push({ id: id, time: G.time + 60 }); // Доставка через 60 игровых минут
    showToast("Заказ оформлен! Доставка через 1 час.");
    updateHUD(); saveGame(); openWholesale(); // Обновляем кнопки
  }
}

function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
</script>
