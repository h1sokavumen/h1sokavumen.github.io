<!DOCTYPE html>
<html lang="ru" data-theme="dark-classic">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Sounds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video autoplay loop muted id="bg-video"><source src="background.mp4" type="video/mp4"></video>

    <nav class="glass-menu">
        <div class="logo"><span>Nova Sounds</span></div>
        <ul class="nav-links">
            <li class="active" onclick="switchTab('recommendations')">Рекомендации</li>
            <li onclick="switchTab('friends')">Друзья</li>
            <li onclick="switchTab('profile')">Мой Профиль</li>
            <li onclick="switchTab('settings')">Настройки</li>
            <li id="nav-admin" style="display: none;" onclick="switchTab('admin')">Админ</li>
        </ul>
        <div id="auth-section"></div>
    </nav>

    <main id="content">
        <div id="recommendations" class="tab-content active">
            <h2>Рекомендации</h2>
            <div id="tracks-container" class="music-grid"></div>
        </div>
        
        <div id="friends" class="tab-content">
            <h2>Найти людей</h2>
            <div class="search-box">
                <input type="text" id="user-search-input" class="glass-input" placeholder="Введите никнейм...">
                <button class="glass-btn accent" onclick="searchUser()">Поиск</button>
            </div>
            <div id="search-result" style="margin-top: 20px;"></div>
        </div>

        <div id="profile" class="tab-content">
            <div id="self-profile-view"></div> <!-- Сюда рендерится профиль -->
        </div>

        <div id="admin" class="tab-content">
            <h2>Админ Панель</h2>
            <div class="admin-grid">
                <div class="glass-panel p-20">
                    <h3>Загрузить трек</h3>
                    <input type="text" id="track-title" class="glass-input" placeholder="Название">
                    <input type="text" id="track-artist" class="glass-input" placeholder="Автор">
                    <p style="font-size: 12px; margin-bottom: 5px;">Выбрать файл с ПК:</p>
                    <input type="file" id="track-file" class="glass-input" accept="audio/mp3">
                    <p style="text-align: center; opacity: 0.5;">ИЛИ ссылка</p>
                    <input type="text" id="track-url" class="glass-input" placeholder="URL .mp3">
                    <button class="glass-btn accent w-100" onclick="uploadTrack()">Опубликовать</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Модалка просмотра чужого профиля -->
    <div id="view-user-modal" class="modal">
        <div class="modal-content glass-panel" style="width: 90%; max-width: 600px; padding: 0; overflow: hidden;">
            <div id="v-user-banner" class="banner" style="height: 120px;"></div>
            <div style="padding: 20px; text-align: center; margin-top: -50px;">
                <img id="v-user-avatar" src="" class="avatar" style="width: 100px; height: 100px;">
                <h2 id="v-user-name"></h2>
                <p id="v-user-bio"></p>
                <button class="glass-btn mt-10" onclick="closeModal('view-user-modal')">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Модалка регистрации/входа -->
    <div id="auth-modal" class="modal">
        <div class="modal-content glass-panel">
            <h2 id="modal-title">Вход</h2>
            <input type="text" id="auth-username" class="glass-input" placeholder="Никнейм">
            <input type="password" id="auth-password" class="glass-input" placeholder="Пароль">
            <button class="glass-btn accent w-100" onclick="submitAuth()">Подтвердить</button>
            <p class="toggle-auth" onclick="toggleAuthMode()">Регистрация</p>
        </div>
    </div>

    <!-- Модалка настроек профиля -->
    <div id="edit-profile-modal" class="modal">
        <div class="modal-content glass-panel">
            <h2>Настройки профиля</h2>
            <input type="text" id="edit-avatar" class="glass-input" placeholder="URL аватарки">
            <input type="text" id="edit-banner" class="glass-input" placeholder="URL баннера">
            <textarea id="edit-bio" class="glass-input" placeholder="О себе..."></textarea>
            <button class="glass-btn accent w-100" onclick="saveProfile()">Сохранить</button>
            <button class="glass-btn w-100 mt-10" onclick="closeModal('edit-profile-modal')">Отмена</button>
        </div>
    </div>

    <div class="music-player">
        <div class="player-info"><b id="p-title">Nova Sounds</b><br><small id="p-artist">Плеер</small></div>
        <audio id="main-audio" controls style="height: 30px; filter: invert(1);"></audio>
    </div>

    <script src="app.js"></script>
</body>
</html>
