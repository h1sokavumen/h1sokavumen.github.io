<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CodeLearn{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #11111a;
  --card: #16161f;
  --border: #2a2a3d;
  --purple: #7c3aed;
  --purple-light: #a855f7;
  --purple-dim: #4c1d95;
  --pink: #ec4899;
  --text: #e2e8f0;
  --muted: #64748b;
  --green: #10b981;
  --red: #ef4444;
  --yellow: #f59e0b;
  --grad: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
  --grad2: linear-gradient(135deg, #4c1d95 0%, #7c3aed 50%, #ec4899 100%);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content:'';
  position:fixed;
  top:-50%;left:-50%;
  width:200%;height:200%;
  background: radial-gradient(ellipse at 20% 20%, rgba(124,58,237,0.08) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 80%, rgba(236,72,153,0.06) 0%, transparent 50%);
  pointer-events:none;
  z-index:0;
}

nav {
  position:fixed;top:0;left:0;right:0;z-index:100;
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 64px;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-logo {
  font-weight:800;font-size:1.3rem;
  background: var(--grad);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:-0.03em;
}
.nav-links { display:flex;gap:0.5rem;align-items:center; }
.nav-links a {
  color:var(--muted);text-decoration:none;
  padding:0.4rem 0.9rem;border-radius:8px;
  font-size:0.9rem;font-weight:600;
  transition:all 0.2s;
}
.nav-links a:hover { color:var(--text);background:var(--surface); }
.btn-nav {
  background: var(--grad);
  color:#fff !important;
  padding:0.4rem 1.1rem !important;
  border-radius:8px;
  font-weight:700 !important;
}
.btn-nav:hover { opacity:0.85; }

main { padding-top:64px; position:relative;z-index:1; }

.btn {
  display:inline-flex;align-items:center;gap:0.5rem;
  padding:0.7rem 1.5rem;border-radius:10px;
  font-family:'Syne',sans-serif;font-weight:700;font-size:0.95rem;
  border:none;cursor:pointer;transition:all 0.2s;text-decoration:none;
}
.btn-primary {
  background:var(--grad);color:#fff;
  box-shadow:0 4px 20px rgba(124,58,237,0.4);
}
.btn-primary:hover { transform:translateY(-2px);box-shadow:0 8px 30px rgba(124,58,237,0.5); }
.btn-outline {
  background:transparent;color:var(--text);
  border:1px solid var(--border);
}
.btn-outline:hover { border-color:var(--purple);color:var(--purple-light); }
.btn-ghost {
  background:var(--surface);color:var(--text);
}
.btn-ghost:hover { background:var(--card); }

.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:1.5rem;
}

.badge {
  display:inline-block;
  padding:0.25rem 0.7rem;
  border-radius:100px;
  font-size:0.75rem;font-weight:700;
  letter-spacing:0.05em;text-transform:uppercase;
}
.badge-purple { background:rgba(124,58,237,0.2);color:var(--purple-light);border:1px solid rgba(124,58,237,0.3); }
.badge-green { background:rgba(16,185,129,0.15);color:var(--green);border:1px solid rgba(16,185,129,0.3); }
.badge-pink { background:rgba(236,72,153,0.15);color:var(--pink);border:1px solid rgba(236,72,153,0.3); }

/* Flash messages */
.flash { position:fixed;top:80px;right:1.5rem;z-index:999;max-width:320px; }
.flash-msg {
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:1rem 1.2rem;margin-bottom:0.5rem;
  animation:slideIn 0.3s ease;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
@keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:none} }

code, pre { font-family:'Space Mono',monospace; }

::-webkit-scrollbar { width:6px;height:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border);border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--purple-dim); }

{% block extra_style %}{% endblock %}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">⚡ CodeLearn</a>
  <div class="nav-links">
    <a href="/learn/python">Python</a>
    <a href="/learn/html">HTML</a>
    <a href="/editor">Редактор</a>
    {% if user %}
      <a href="/admin" style="color:var(--yellow)">⚙ Админ</a>
      <a href="/logout" class="btn-nav">{{ user }} →</a>
    {% else %}
      <a href="/login">Войти</a>
      <a href="/register" class="btn-nav">Регистрация</a>
    {% endif %}
  </div>
</nav>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
