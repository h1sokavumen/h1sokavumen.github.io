<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Cloud Pro Max</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #f3f4f6; --white: #fff; --primary: #6366f1; --primary-hover: #4f46e5; --dark: #1f2937; --light: #6b7280; --border: #e5e7eb; --radius: 16px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--dark); display: flex; height: 100vh; overflow: hidden; user-select: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease forwards; }

        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .auth-box { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .input-wrapper { position: relative; margin-bottom: 15px; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--light); }
        .input-wrapper input { width: 100%; padding: 14px 14px 14px 45px; border: 1px solid var(--border); border-radius: 12px; outline: none; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; transition: 0.3s;}
        .btn-main:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .error-msg { color: #ef4444; font-size: 13px; margin-bottom: 15px; display: none; background: #fee2e2; padding: 10px; border-radius: 8px; }

        #app-screen { display: none; width: 100%; height: 100%; }
        .sidebar { width: 250px; background: var(--white); padding: 30px 20px; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .nav-item { padding: 14px 15px; margin-bottom: 8px; border-radius: 12px; cursor: pointer; color: var(--light); display: flex; align-items: center; gap: 15px; font-weight: 500; transition: 0.2s;}
        .nav-item:hover, .nav-item.active { background: #eef2ff; color: var(--primary); }
        
        .content { flex: 1; padding: 40px; overflow-y: auto; background: var(--bg); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn { background: var(--white); border: 1px solid var(--border); padding: 10px 15px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-blue { background: var(--primary); color: white; border: none; }
        #paste-btn { background: #10b981; color: white; border: none; display: none; animation: fadeIn 0.3s ease; }

        .path-nav { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .back-btn { background: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; display: none; font-weight: bold; color: var(--primary); transition: 0.2s; border: 2px solid transparent;}
        .back-btn.drag-over { border-color: var(--primary); background: #eef2ff; transform: scale(1.05); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .card { background: var(--white); padding: 25px 15px; border-radius: var(--radius); text-align: center; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: 0.3s; border: 2px solid transparent; }
        .card:hover { transform: translateY(-5px); border-color: #eef2ff; }
        .card.drag-over { border: 2px dashed var(--primary); background: #eef2ff; transform: scale(1.05); }
        .card i { font-size: 45px; margin-bottom: 15px; transition: 0.3s; }
        .card:hover i { transform: scale(1.1); }
        .folder-icon { color: #f59e0b; } .file-icon { color: var(--primary); } .party-icon { color: #10b981; }
        .card-title { font-weight: 500; font-size: 14px; word-break: break-all; }

        #context-menu { display: none; position: absolute; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 12px; overflow: hidden; z-index: 100; width: 160px; border: 1px solid var(--border); }
        #context-menu div { padding: 12px 15px; cursor: pointer; font-size: 14px; display: flex; gap: 10px; align-items: center; }
        #context-menu div:hover { background: #eef2ff; color: var(--primary); }
        #context-menu .danger { color: #ef4444; border-top: 1px solid var(--border); }

        /* ОКНО ПРЕДПРОСМОТРА */
        #preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(5px); }
        .close-preview { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; transition: 0.2s; }
        .close-preview:hover { color: #ef4444; transform: scale(1.1); }

        .page { display: none; } .page.active { display: block; }
    </style>
</head>
<body>

    <!-- ФОНОВАЯ МУЗЫКА -->
    <audio id="bg-music" loop>
        <source src="/music" type="audio/mpeg">
    </audio>

    <!-- ОКНО ПРЕДПРОСМОТРА -->
    <div id="preview-modal">
        <div class="close-preview" onclick="closePreview()">&times;</div>
        <div id="preview-content" style="max-width: 90%; max-height: 90%; display: flex; justify-content: center; align-items: center;"></div>
    </div>

    <!-- МЕНЮ ПРАВОЙ КНОПКИ -->
    <div id="context-menu">
        <div onclick="actionCut()"><i class="fas fa-cut"></i> Вырезать</div>
        <div onclick="actionDownload()"><i class="fas fa-download"></i> Скачать</div>
        <div class="danger" onclick="actionDelete()"><i class="fas fa-trash"></i> Удалить</div>
    </div>

    <div id="auth-screen">
        <div class="auth-box">
            <h2 id="auth-title">С возвращением!</h2>
            <div id="error-box" class="error-msg"></div>
            <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" placeholder="Логин" id="login-input"></div>
            <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" placeholder="Пароль" id="password-input"></div>
            <button class="btn-main" id="auth-btn" onclick="submitAuth()">Войти</button>
            <div class="auth-switch" style="margin-top:20px; cursor:pointer;" onclick="toggleAuthMode()">Нет аккаунта? <span style="color:var(--primary); font-weight:bold;">Создать</span></div>
        </div>
    </div>

    <div id="app-screen">
        <div class="sidebar">
            <div class="logo"><i class="fas fa-cloud"></i> MyCloud</div>
            <div class="nav-item active" onclick="switchPage('personal')"><i class="fas fa-folder"></i> Мои файлы</div>
            <div class="nav-item" onclick="switchPage('party')"><i class="fas fa-users"></i> Party-облако</div>
            <div class="nav-item" onclick="logout()" style="margin-top:auto; color:#ef4444;"><i class="fas fa-sign-out-alt"></i> Выход</div>
        </div>

        <div class="content">
            <div id="personal-page" class="page active">
                <div class="header">
                    <h1 id="space-title">Личное пространство</h1>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn" id="paste-btn" onclick="actionPaste()"><i class="fas fa-paste"></i> Вставить</button>
                        <button class="btn" onclick="createFolder()"><i class="fas fa-folder-plus"></i> Новая папка</button>
                        <input type="file" id="file-input" style="display: none;" onchange="uploadFile(this)">
                        <button class="btn btn-blue" onclick="document.getElementById('file-input').click()"><i class="fas fa-upload"></i> Загрузить</button>
                    </div>
                </div>
                
                <!-- КНОПКА НАЗАД (ТЕПЕРЬ ПРИНИМАЕТ ФАЙЛЫ ПРИ ПЕРЕТАСКИВАНИИ!) -->
                <div class="path-nav">
                    <button class="back-btn" id="back-btn" onclick="goBack()" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)" ondrop="dropFileUp(event)">
                        <i class="fas fa-arrow-left"></i> Назад
                    </button>
                    <span id="current-path-display" style="color: var(--light); font-weight: 500;">/ (Корень)</span>
                </div>
                
                <div class="grid" id="personal-grid"></div>
            </div>

            <!-- Вкладка Party -->
            <div id="party-page" class="page">
                <div class="header"><h1>Party-облако</h1></div>
                <div style="display: flex; gap: 20px; margin-bottom: 30px;">
                    <div style="background: white; padding: 25px; border-radius: 20px; flex: 1;">
                        <h3>Создать Party</h3>
                        <input type="text" id="new-party-name" placeholder="Название комнаты" style="width:100%; padding:10px; margin:15px 0; border:1px solid var(--border); border-radius:8px;">
                        <button class="btn btn-blue" style="width:100%; justify-content:center;" onclick="createParty()">Сгенерировать</button>
                    </div>
                    <div style="background: white; padding: 25px; border-radius: 20px; flex: 1;">
                        <h3>Войти в Party</h3>
                        <input type="text" id="join-party-name" placeholder="Название" style="width:100%; padding:10px; margin-top:15px; border:1px solid var(--border); border-radius:8px;">
                        <input type="password" id="join-party-pass" placeholder="Пароль" style="width:100%; padding:10px; margin:10px 0; border:1px solid var(--border); border-radius:8px;">
                        <button class="btn" style="width:100%; justify-content:center; background:#10b981; color:white; border:none;" onclick="joinParty()">Подключиться</button>
                    </div>
                </div>
                <div class="grid" id="party-grid"></div>
            </div>
        </div>
    </div>

    <script>
        let currentPath = ""; 
        let isLoginMode = true;
        let clipboard = null; // Буфер обмена для вырезанных файлов

        // Запуск музыки
        function playMusic() {
            let audio = document.getElementById('bg-music');
            audio.volume = 0.1; // Громкость 10%
            audio.play().catch(e => console.log("Музыка ждет первого клика"));
        }

        window.onload = async () => {
            let res = await fetch('/auth/me');
            let data = await res.json();
            if (data.logged_in) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                playMusic(); // Включаем музыку, если пользователь уже авторизован
                loadFiles(); loadParties();
            }
        };

        // Авторизация
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'С возвращением!' : 'Создать аккаунт';
            document.getElementById('auth-btn').innerText = isLoginMode ? 'Войти' : 'Зарегистрироваться';
            document.querySelector('.auth-switch').innerHTML = isLoginMode ? 'Нет аккаунта? <span style="color:var(--primary); font-weight:bold;">Создать</span>' : 'Уже есть аккаунт? <span style="color:var(--primary); font-weight:bold;">Войти</span>';
        }

        async function submitAuth() {
            playMusic(); // Запуск музыки по первому клику
            const login = document.getElementById('login-input').value;
            const pass = document.getElementById('password-input').value;
            let fd = new FormData(); fd.append('username', login); fd.append('password', pass);
            let endpoint = isLoginMode ? '/auth/login' : '/auth/register';
            let res = await fetch(endpoint, { method: 'POST', body: fd });
            let data = await res.json();
            if (data.success) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                loadFiles(); loadParties();
            } else {
                document.getElementById('error-box').style.display = 'block';
                document.getElementById('error-box').innerText = data.error;
            }
        }
        async function logout() { await fetch('/auth/logout', { method: 'POST' }); location.reload(); }

        // Навигация
        function switchPage(id) {
            document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.getElementById(id + '-page').classList.add('active');
            if(id === 'personal') { currentPath = ""; document.getElementById('space-title').innerText = "Личное пространство"; loadFiles(); }
            else if (id === 'party') { loadParties(); }
        }

        // Загрузка файлов
        async function loadFiles() {
            let fd = new FormData(); fd.append('path', currentPath);
            let res = await fetch('/list', { method: 'POST', body: fd });
            let items = await res.json();
            const grid = document.getElementById('personal-grid');
            grid.innerHTML = '';
            document.getElementById('current-path-display').innerText = currentPath === "" ? "/ (Корень)" : "/ " + currentPath;
            document.getElementById('back-btn').style.display = currentPath === "" ? "none" : "block";

            items.forEach((item, index) => {
                let delay = index * 0.05;
                if (item.is_dir) {
                    grid.innerHTML += `<div class="card animate-fade" style="animation-delay: ${delay}s" onclick="openFolder('${item.name}')" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)" ondrop="dropFileFolder(event, '${item.name}')" oncontextmenu="showContextMenu(event, '${item.name}', true)"><i class="fas fa-folder folder-icon"></i><div class="card-title">${item.name}</div></div>`;
                } else {
                    // Обрати внимание: добавлен onclick="openPreview('${item.name}')" для предпросмотра
                    grid.innerHTML += `<div class="card animate-fade" style="animation-delay: ${delay}s" onclick="openPreview('${item.name}')" draggable="true" ondragstart="dragStart(event, '${item.name}')" oncontextmenu="showContextMenu(event, '${item.name}', false)"><i class="fas fa-file file-icon"></i><div class="card-title">${item.name}</div></div>`;
                }
            });
        }

        function openFolder(folderName) { currentPath = currentPath === "" ? folderName : currentPath + "/" + folderName; loadFiles(); }
        function goBack() { let parts = currentPath.split('/'); parts.pop(); currentPath = parts.join('/'); loadFiles(); }

        // Создание и загрузка
        async function createFolder() {
            const name = prompt("Имя папки:");
            if(!name) return;
            let fd = new FormData(); fd.append('path', currentPath); fd.append('name', name);
            await fetch('/create_folder', { method: 'POST', body: fd }); loadFiles();
        }
        async function uploadFile(input) {
            if (!input.files[0]) return;
            let fd = new FormData(); fd.append('path', currentPath); fd.append('file', input.files[0]);
            await fetch('/upload', { method: 'POST', body: fd }); input.value = ''; loadFiles();
        }

        // --- ПРЕДПРОСМОТР (ФОТО, ВИДЕО, PDF) ---
        function openPreview(name) {
            const ext = name.split('.').pop().toLowerCase();
            const url = `/download?path=${encodeURIComponent(currentPath)}&name=${encodeURIComponent(name)}`;
            const container = document.getElementById('preview-content');
            
            if (['jpg','jpeg','png','gif','webp'].includes(ext)) {
                container.innerHTML = `<img src="${url}" style="max-width:100%; max-height:85vh; border-radius:10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">`;
            } else if (['mp4','webm','ogg'].includes(ext)) {
                container.innerHTML = `<video controls autoplay style="max-width:100%; max-height:85vh; border-radius:10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);"><source src="${url}" type="video/${ext}"></video>`;
            } else if (ext === 'pdf') {
                container.innerHTML = `<iframe src="${url}" style="width:80vw; height:85vh; background:white; border-radius:10px;"></iframe>`;
            } else {
                container.innerHTML = `<div style="background:white; padding:40px; border-radius:16px; text-align:center;">
                    <i class="fas fa-file file-icon" style="font-size:60px; margin-bottom:20px;"></i>
                    <h3>К сожалению, предпросмотр не поддерживается</h3><br>
                    <button class="btn btn-blue" onclick="window.open('${url}')" style="margin: 0 auto;">Скачать файл</button>
                </div>`;
            }
            document.getElementById('preview-modal').style.display = 'flex';
        }
        function closePreview() { document.getElementById('preview-modal').style.display = 'none'; document.getElementById('preview-content').innerHTML = ''; }


        // --- ПРАВАЯ КНОПКА & ВЫРЕЗАТЬ / ВСТАВИТЬ ---
        let selectedItem = ""; 
        document.addEventListener("click", () => document.getElementById("context-menu").style.display = "none");

        function showContextMenu(e, name) {
            e.preventDefault(); e.stopPropagation(); selectedItem = name;
            const menu = document.getElementById("context-menu");
            menu.style.display = "block"; menu.style.left = e.pageX + "px"; menu.style.top = e.pageY + "px";
        }

        // ВЫРЕЗАТЬ
        function actionCut() {
            clipboard = { path: currentPath, name: selectedItem };
            document.getElementById('paste-btn').style.display = 'flex';
            document.getElementById('paste-btn').innerHTML = `<i class="fas fa-paste"></i> Вставить: ${selectedItem}`;
        }

        // ВСТАВИТЬ (Работает между любыми папками!)
        async function actionPaste() {
            if(!clipboard) return;
            let fd = new FormData(); fd.append('old_path', clipboard.path); fd.append('new_path', currentPath); fd.append('filename', clipboard.name);
            await fetch('/move_advanced', { method: 'POST', body: fd });
            clipboard = null; document.getElementById('paste-btn').style.display = 'none'; loadFiles();
        }

        function actionDownload() { window.open(`/download?path=${currentPath}&name=${selectedItem}`, '_blank'); }
        async function actionDelete() {
            if(confirm(`Удалить ${selectedItem}?`)) { let fd = new FormData(); fd.append('path', currentPath); fd.append('name', selectedItem); await fetch('/delete', { method: 'POST', body: fd }); loadFiles(); }
        }

        // --- DRAG AND DROP (В ПАПКУ И НАЗАД) ---
        function dragStart(e, name) { e.dataTransfer.setData("text", name); }
        function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
        function leaveDrop(e) { e.currentTarget.classList.remove('drag-over'); }
        
        // Бросить в папку (вниз)
        async function dropFileFolder(e, folderName) {
            e.preventDefault(); e.currentTarget.classList.remove('drag-over');
            let filename = e.dataTransfer.getData("text");
            let fd = new FormData(); fd.append('old_path', currentPath); fd.append('new_path', currentPath === "" ? folderName : currentPath + "/" + folderName); fd.append('filename', filename);
            await fetch('/move_advanced', { method: 'POST', body: fd }); loadFiles();
        }

        // Бросить на кнопку "Назад" (вверх)
        async function dropFileUp(e) {
            e.preventDefault(); e.currentTarget.classList.remove('drag-over');
            if(currentPath === "") return; // Если уже в корне, ничего не делаем
            let filename = e.dataTransfer.getData("text");
            
            let parts = currentPath.split('/'); parts.pop(); let parentPath = parts.join('/'); // Вычисляем путь на уровень выше
            
            let fd = new FormData(); fd.append('old_path', currentPath); fd.append('new_path', parentPath); fd.append('filename', filename);
            await fetch('/move_advanced', { method: 'POST', body: fd }); loadFiles();
        }

        // --- PARTY ОБЛАКО ---
        async function loadParties() {
            let res = await fetch('/party/list'); let parties = await res.json();
            const grid = document.getElementById('party-grid'); grid.innerHTML = '';
            parties.forEach(p => { grid.innerHTML += `<div class="card animate-fade" onclick="openPartyFolder('${p.folder}', '${p.name}')"><i class="fas fa-users party-icon"></i><div class="card-title">${p.name}</div></div>`; });
        }
        async function createParty() {
            const name = document.getElementById('new-party-name').value;
            if(!name) { alert("Введите название!"); return; }
            const pass = Math.random().toString(36).slice(-6);
            let fd = new FormData(); fd.append('name', name); fd.append('password', pass);
            let res = await fetch('/party/create', { method: 'POST', body: fd }); let data = await res.json();
            if(data.success) { document.getElementById('new-party-name').value = ''; loadParties(); navigator.clipboard.writeText(pass); alert(`Создана: ${name}\nПароль: ${pass}\nПАРОЛЬ СКОПИРОВАН!`); }
        }
        async function joinParty() {
            const name = document.getElementById('join-party-name').value; const pass = document.getElementById('join-party-pass').value;
            if(!name || !pass) return;
            let fd = new FormData(); fd.append('name', name); fd.append('password', pass);
            let res = await fetch('/party/join', { method: 'POST', body: fd }); let data = await res.json();
            if(data.success) { document.getElementById('join-party-name').value = ''; document.getElementById('join-party-pass').value = ''; loadParties(); alert(`Вы вошли в: ${name}`); } else alert(data.error);
        }
        function openPartyFolder(folderPath, displayName) { switchPage('personal'); currentPath = folderPath; document.getElementById('space-title').innerText = "Комната: " + displayName; loadFiles(); }
    </script>
</body>
</html>
